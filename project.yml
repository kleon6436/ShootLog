name: ShootLog
options:
  bundleIdPrefix: com.shootlog
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true

settings:
  base:
    PRODUCT_NAME: ShootLog
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    # 日本語識別子を許容するためSwiftLintは別途設定
    OTHER_SWIFT_FLAGS: ""

targets:
  ShootLog:
    type: application
    platform: macOS
    sources:
      - path: ShootLog
        excludes:
          - "**/*.md"
    resources:
      - path: ShootLog/Resources
    entitlements:
      path: ShootLog/ShootLog.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
    settings:
      base:
        INFOPLIST_FILE: ShootLog/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.shootlog.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_ASSET_PATHS: '"ShootLog/Preview Content"'
    dependencies: []

schemes:
  ShootLog:
    build:
      targets:
        ShootLog: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
