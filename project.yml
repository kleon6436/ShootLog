name: ShootLog
attributes:
  LastUpgradeCheck: "2660"
options:
  bundleIdPrefix: com.shootlog
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true
  developmentLanguage: ja
  postGenCommand: "Scripts/xcodegen-postprocess.sh"

settings:
  base:
    PRODUCT_NAME: ShootLog
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: complete
    ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOLS: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CLANG_ANALYZER_LOCALIZABILITY_NONLOCALIZED: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    # 日本語識別子を許容するためSwiftLintは別途設定
    OTHER_SWIFT_FLAGS: ""

targets:
  ShootLog:
    type: application
    platform: macOS
    sources:
      - path: ShootLog
        excludes:
          - "**/*.md"
    entitlements:
      path: ShootLog/ShootLog.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.personal-information.photos-library: true
    settings:
      base:
        INFOPLIST_FILE: ShootLog/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.shootlog.app
        ASSETCATALOG_COMPILER_APPICON_NAME: ShootLog
        DEVELOPMENT_TEAM: 235777R328
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        DEAD_CODE_STRIPPING: YES
    dependencies: []

  ShootLogTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ShootLogTests
    dependencies:
      - target: ShootLog
    settings:
      base:
        PRODUCT_NAME: ShootLogTests
        PRODUCT_BUNDLE_IDENTIFIER: com.shootlog.app.tests
        DEAD_CODE_STRIPPING: YES

schemes:
  ShootLog:
    build:
      targets:
        ShootLog: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ShootLogTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
